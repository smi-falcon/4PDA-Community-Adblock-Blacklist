name: Update Blacklist

on:
  push:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install hostlist-compiler
        run: npm install -g @adguard/hostlist-compiler@2.1.1

      - name: Download hosts file
        run: curl -4 -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" --retry 5 --retry-delay 10 --connect-timeout 20 https://schakal.hopto.org/hosts.txt -o Blacklist_hosts.txt

      - name: Compile hosts to Adblock
        run: hostlist-compiler -i Blacklist_hosts.txt -t hosts -o Blacklist_adblock.txt

      - name: Add header
        run: node scripts/add-header.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update blacklist [skip ci]'
          file_pattern: 'Blacklist_hosts.txt Blacklist_adblock.txt'
          push_options: '--force-with-lease'
